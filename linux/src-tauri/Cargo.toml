[package]
name = "olaz-linux"
version = "1.0.0"
description = "Olaz cho Linux — vỏ Tauri chạy renderer chính thức của Zalo PC"
authors = ["Olaz contributors"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
aes-gcm = "0.10"
rand = "0.8"
libc = "0.2"
percent-encoding = "2"
jxl-oxide = { version = "0.12", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
notify-rust = "4"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
