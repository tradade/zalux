# Builds the Linux AppImage and attaches it to a release.
#
# Triggers:
#   * push a tag  `linux-v*`          → build + create/update the release under
#                                       the same tag
#   * workflow_dispatch (manual)      → build only; the AppImage lands in the
#                                       job artifacts for testing
#
# Release target: the repository running this workflow by default (the built-in
# GITHUB_TOKEN is enough). To publish into a different repo instead, set the
# DIST_REPO env below and add a `ZALUX_RELEASE_TOKEN` secret (PAT with
# Contents: read/write on that repository).

name: linux-release

on:
  push:
    tags:
      - 'linux-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref to build (branch/commit). Mặc định: ref kích hoạt'
        required: false
        default: ''

permissions:
  contents: read

env:
  DIST_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      artifact: ${{ steps.collect.outputs.artifact }}
    steps:
      - name: Checkout nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Git history đầy đủ để sinh changelog (git log giữa 2 tag).
          fetch-depth: 0

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux/src-tauri

      - name: Go (fingerprint helper)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Phụ thuộc hệ thống (Tauri v2 / WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential curl wget file patchelf

      - name: Build AppImage
        working-directory: linux
        env:
          # Nhúng tag release vào binary để auto-update biết bản hiện tại.
          APP_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build-appimage.sh

      - name: Thu thập artefact + checksum
        id: collect
        run: |
          mkdir -p out
          # Build chạy trong `linux/`, nên thư mục bundle nằm ở
          # `linux/src-tauri/target/release/bundle/` — tìm từ root cho khỏi đoán.
          find . -name '*.AppImage' -not -path './.git/*' -exec cp {} out/ \;
          find . -name '*.deb' -not -path './.git/*' -exec cp {} out/ \;
          ls out/ | grep -q . || { echo 'không tìm thấy package sau build' >&2; exit 1; }
          (cd out && sha256sum *.AppImage *.deb > SHA256SUMS)
          echo "artifact=Olaz-linux-packages" >> "$GITHUB_OUTPUT"
          cat out/SHA256SUMS

      - name: Sinh changelog từ commit giữa 2 tag
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          RANGE="${PREV:+${PREV}..}${TAG}"
          echo "Changelog range: ${RANGE:-<tag đầu tiên>}"
          {
            echo "## Thay đổi trong ${TAG}"
            echo
            if [ -n "$PREV" ]; then echo "_Từ ${PREV}_"; echo; fi
            git log --no-merges --format='- %s' ${RANGE} \
              | grep -v -iE '^- (README|changelog|ci)[:(]' || true
            echo
          } > out/changelog.md
          cat out/changelog.md

      - name: Upload artefact (mọi lần chạy)
        uses: actions/upload-artifact@v4
        with:
          name: Olaz-linux-packages
          path: out/

  release:
    needs: build
    # Chỉ tạo release khi chạy theo tag — bản workflow_dispatch ở lại artefact.
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: out

      - name: Ghép notes của release (header + changelog)
        run: |
          {
            echo "Olaz Linux — bản dựng chính thức của tag \`${GITHUB_REF_NAME}\`."
            echo
            echo "- Nguồn: \`${GITHUB_REPOSITORY}@${GITHUB_SHA}\`"
            echo "- Kiểm tra toàn vẹn: xem \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`)"
            echo "- Lần chạy đầu app tự tải runtime Zalo PC từ VNG (~323 MB) và"
            echo "  kiểm tra SHA-256 của bản ghim — repo này không phân phối code VNG."
            echo
            if [ -f out/changelog.md ]; then cat out/changelog.md; fi
            echo "**Unofficial project, không liên quan tới VNG.** Dùng với tài khoản"
            echo "của bạn và tự chịu rủi ro theo ToS của Zalo."
          } > out/release-notes.md
          cat out/release-notes.md

      - name: Tạo release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.ZALUX_RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: Olaz Linux ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body_path: out/release-notes.md
          files: |
            out/*.AppImage
            out/*.deb
            out/SHA256SUMS
